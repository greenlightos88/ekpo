      - name: Source integrity gate
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('01_SCREENPLAY.fountain').read_text(encoding='utf-8')
          required=[
            '# SEQUENCE 1 - THE LAST MORNING',
            '# SEQUENCE 10 - THE TWO RECORDS',
            '# SEQUENCE 11 - WHAT HE LEFT',
            '# SEQUENCE 12 - WHEN IT STAYS',
            '# SEQUENCE 13 - THE MARKET',
            'Ade and Kai follow his gaze.',
            'FIELD OF RED CORD',
            'Nobody has to pass the back passage to leave.',
            'The inner door does not move.',
            'We left the house.'
          ]
          for x in required:
              if x not in s: raise SystemExit('Missing required revision: '+x)
          forbidden=[
            'The three brothers follow his gaze.',
            '\nENO\nCar.\n',
            'One turn short.',
            'The loose brass fastener remains on the sill.',
            'Return what was dislodged.',
            'EKPE masquerade dancers',
            'The masquerade is the Entity',
          ]
          for x in forbidden:
              if x.lower() in s.lower(): raise SystemExit('Forbidden legacy/revision text remains: '+x)
          heads=re.findall(r'^# SEQUENCE (\d+) - ',s,re.M)
          if heads != [str(i) for i in range(1,14)]: raise SystemExit('Sequence heading order failure: '+repr(heads))
          if re.search(r'END OF SEQUENCE\s+[IVXLCDM]+\b',s): raise SystemExit('Roman sequence marker')
          print('Source integrity PASS')

