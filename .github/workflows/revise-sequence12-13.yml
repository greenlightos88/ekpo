name: Human-audit Sequence 12-13 revision

on:
  push:
    branches:
      - agent/sequence-12-geography-sequence-13-marketplace
    paths:
      - .github/workflows/revise-sequence12-13.yml

permissions:
  contents: write

jobs:
  revise:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sequence-12-geography-sequence-13-marketplace
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: python -m pip install --disable-pip-version-check reportlab pypdf pymupdf

      - name: Apply human-audit screenplay revision
        run: python tools/apply_human_audit_revision.py

      - name: Source integrity gate
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('01_SCREENPLAY.fountain').read_text(encoding='utf-8')
          required=['# SEQUENCE 13 - THE MARKET','Ade and Kai follow his gaze.','FIELD OF RED CORD','Nobody has to pass the back passage to leave.','The inner door does not move.','We left the house.']
          for x in required:
              if x not in s: raise SystemExit('missing '+x)
          forbidden=['The three brothers follow his gaze.','\nENO\nCar.\n','One turn short.','The loose brass fastener remains on the sill.','Return what was dislodged.']
          for x in forbidden:
              if x.lower() in s.lower(): raise SystemExit('legacy text remains '+x)
          heads=re.findall(r'^# SEQUENCE (\d+) - ',s,re.M)
          if heads != [str(i) for i in range(1,14)]: raise SystemExit('sequence order '+repr(heads))
          print('Source integrity PASS')

      - name: Render exact candidate PDF
        run: python tools/render_screenplay.py 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf

      - name: Audit rendered PDF
        shell: python
        run: |
          from pathlib import Path
          from pypdf import PdfReader
          import pymupdf
          pdf=Path('output/pdf/EKPO_Screenplay.pdf')
          if not pdf.exists() or pdf.stat().st_size < 50000: raise SystemExit('PDF missing or too small')
          pages=len(PdfReader(str(pdf)).pages)
          doc=pymupdf.open(pdf)
          if len(doc)!=pages: raise SystemExit('page count mismatch')
          blank=[]; edges=[]; tiny=[]; text=[]; fonts=set()
          for i,page in enumerate(doc):
              t=page.get_text('text'); text.append(t)
              if i>0 and len(t.strip())<80: blank.append(i+1)
              r=page.rect
              for b in page.get_text('blocks'):
                  x0,y0,x1,y1=b[:4]
                  if x0<8 or y0<8 or x1>r.width-8 or y1>r.height-8: edges.append(i+1)
              spans=[]
              for block in page.get_text('dict').get('blocks',[]):
                  for line in block.get('lines',[]): spans.extend(line.get('spans',[]))
              if spans and min(float(sp.get('size',99)) for sp in spans)<7: tiny.append(i+1)
              for f in page.get_fonts(full=True): fonts.add(f[3])
          if blank: raise SystemExit('blank pages '+repr(blank))
          if edges: raise SystemExit('edge risks '+repr(sorted(set(edges))))
          if tiny: raise SystemExit('tiny text '+repr(tiny))
          alltext='\n'.join(text)
          for x in ['Ade and Kai follow his gaze.','FIELD OF RED CORD','Nobody has to pass the back passage to leave.','We left the house.']:
              if x not in alltext: raise SystemExit('render missing '+x)
          if not any('Courier' in f for f in fonts): raise SystemExit('Courier missing')
          print('PDF PASS physical_pages=',pages,'bytes=',pdf.stat().st_size)

      - name: Commit candidate screenplay and PDF
        shell: pwsh
        run: |
          git config user.name "EKPO Repository Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/revise-sequence12-13.yml
          git rm tools/apply_human_audit_revision.py
          git add 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf
          git diff --cached --check
          git commit -m "Rebuild Sequence 12 geography and restore market Sequence 13"
          git push origin HEAD:agent/sequence-12-geography-sequence-13-marketplace
