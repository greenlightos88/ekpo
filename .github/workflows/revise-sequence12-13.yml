red cord/knot array changes tension/slack/alignment during Sequence 12.\n- Most elements return toward baseline when pressure reduces; several do not.\n- The brothers have not seen the array react and do not yet know how to interpret it.\n\n## Sequence 13 candidate — THE MARKET\n\nMorning begins with breakfast outside/front of the house. Residual injuries are visible and nobody is eager to move deeper into the house.\n\nEno invents an ordinary market errand and tells Bode to take the brothers out. The action is practical rather than therapeutic exposition.\n\nAt the market:\n\n- ordinary Calabar life gets genuine breathing room before horror resumes;\n- Kai leaves his cracked camera at home;\n- a public masquerade procession is treated as normal community culture, not supernatural threat;\n- the Entity becomes perceptible in negative space around the procession rather than inhabiting a performer;\n- Kai recognizes metallic taste/pressure and deliberately avoids sustained looking;\n- Malik and Ade recognize his response and work together to keep contact in the crowd;\n- public shoppers do not appear to recognize the Entity;\n- the brothers experience limited spatial/temporal distortion and residual physiology without repeating Sequence 12's full bodily collapse;\n- Bode uses ordinary market geography to move them out;\n- away from the house, the same pressure has still reached them.\n\nThis establishes at character-experience level that physical distance from the house is not sufficient protection. It does not establish a complete theory of how far the Entity can travel or what it is attached to.\n\n## Knowledge boundary\n\nThe brothers know/strongly suspect:\n\n- the manifestation can endanger family members who become involved or look toward it;\n- moving uninformed family away coincided with reduced pressure;\n- their own sustained attention remains dangerous;\n- the phenomenon is not confined to the Oku house.\n\nThey still do not know:\n\n- formal Seen/Unseen te