Status: ACTIVE SPATIAL AUTHORITY
Effective: 2026-08-17

## Spatial law

Normal geography must be mechanically coherent before supernatural distortion is allowed to violate it.

No character may perceive, enter, exit, cross, or react to a location unless the screenplay establishes a plausible route or sightline. If the Entity makes space impossible, the audience must first know what the space normally is.

## Oku family house — locked layout

- The older family house faces the compound courtyard through a deep front veranda.
- The front/family room opens directly onto that veranda and courtyard.
- The kitchen has a separate door onto the same courtyard.
- Between the kitchen wall and the older rear rooms, a narrow **back passage** runs deeper into the house and drops three shallow steps below the main floor.
- The **outer red-corded door** sits at the low/far end of that back passage.
- The outer red-corded door does not open directly into a visible room. Four additional stone steps descend beneath the rear of the house.
- The **maintenance room** is semi-underground beneath the rear rooms.
- High slatted maintenance-room windows sit near ceiling height, approximately at yard level outside.
- The **inner maintained door** is on the wall opposite the maintenance-room entrance.
- There is **no direct sightline from the courtyard, veranda, kitchen, front room, or compound gate to the inner maintained door.** A character must enter the back passage, open the outer door, descend, and enter the maintenance room to see it.
- The compound gate lies across the open yard, away from the mouth of the back passage. Movement from the front room/veranda toward the gate does not require crossing the back-passage axis.

## Sequence 12 blocking law

The Entity manifests in the **back-passage axis**, not at the inner door.

During the evacuation:

- family members leave the front room/veranda and move across the courtyard toward the compound gate;
- Ade blocks sightlines toward the back passage;
- nobody crosses through the Entity's manifestation axis in order to evacuate;
- the inner maintained door is never visible to the brothers during the courtyard encounter.

## Production requirement

Before production lock, create a floor plan from this document and reconcile every house scene against it. If production design changes the layout, screenplay blocking and continuity must be updated together.
''', encoding='utf-8')

          Path('docs/REGULATOR_CORD_ARRAY.md').write_text('''# EKPO — REGULATOR CORD / KNOT DIAGNOSTIC ARRAY

Status: LOCKED WRITER-LEVEL CANON
Effective: 2026-08-17

## Function

The dense red-cord architecture surrounding the inner maintained door is part of Solomon's procedural monitoring system.

It is a **material analog indicator of regulatory pressure**: changes in tension, fall, slack, alignment, and knot position can make instability physically legible to a trained steward.

It is not a magical alarm, sentient rope, haunted decoration, or independent supernatural being.

## Physical design

The inner-door wall contains:

- measured brass anchor points;
- short lengths of red cord installed at exact intervals;
- worked knots tied to repeatable positions;
- loose tails whose resting lengths can be compared to pencil marks;
- older cut ends and retired configurations preserved behind newer work;
- enough accumulated layers that hundreds of active/visible elements imply years of thousands of individual maintenance decisions.

The array should feel handmade, maintained, technical, inherited, and difficult to read without training.

## Behavior under pressure

Allowed responses include:

- one row drawing taut while another falls slack;
- loose tails lifting or rotating slightly without ambient wind;
- a knot slipping by a measurable amount;
- neighboring rows settling at unequal lengths;
- tension redistributing in a slow, material sequence;
- some elements failing to return fully to baseline after an event.

Disallowed behavior:

- rope writhing like snakes;
- dramatic self-untying as spectacle;
- cords reaching for people;
- floating or levitating bundles;
- a universal rule that every red cord in the story reacts;
- treating motion as proof the Entity is physically inside the room.

## Scope

Only the **inner diagnostic array** has this pressure-indicating function.

The outer household cord, stored replacement cotton, and shrine binding have their own established functions and must not begin moving merely because they are red.

## Story use

Sequence 10 establishes the array in a stable baseline: dense, measured, completely still.

Sequence 12 shows the audience — without giving the brothers a view of the room — that the breach/manifestation produces measurable tension changes in the array. The inner door itself does not move.

The brothers do not yet know how to read the array or what each change means. Later understanding must be earned from records, comparison, training, and repeated observation rather than a lore speech.
''', encoding='utf-8')

