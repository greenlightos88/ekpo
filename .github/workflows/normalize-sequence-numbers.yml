name: Normalize Sequence Numbers

on:
  push:
    branches:
      - agent/authoritative-canon-sync
    paths:
      - .github/workflows/normalize-sequence-numbers.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab pypdf
      - name: Replace Roman sequence headings
        shell: python
        run: |
          from pathlib import Path
          p = Path('01_SCREENPLAY.fountain')
          text = p.read_text(encoding='utf-8')
          replacements = [('X','10'),('IX','9'),('VIII','8'),('VII','7'),('VI','6'),('V','5'),('IV','4'),('III','3'),('II','2'),('I','1')]
          for old,new in replacements:
              text = text.replace(f'# SEQUENCE {old} -', f'# SEQUENCE {new} -')
          p.write_text(text, encoding='utf-8', newline='\n')
      - name: Render PDF
        run: python tools/render_screenplay.py 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          from pypdf import PdfReader
          text = Path('01_SCREENPLAY.fountain').read_text(encoding='utf-8')
          for n in range(1,13):
              assert f'# SEQUENCE {n} -' in text
          assert '# SEQUENCE I -' not in text
          assert '# SEQUENCE X -' not in text
          assert len(PdfReader('output/pdf/EKPO_Screenplay.pdf').pages) == 58
      - name: Commit and self-delete
        shell: pwsh
        run: |
          git config user.name 'EKPO Repository Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf
          git rm -f .github/workflows/normalize-sequence-numbers.yml
          git commit -m 'Normalize EKPO sequence numbering'
          git push origin HEAD:agent/authoritative-canon-sync
