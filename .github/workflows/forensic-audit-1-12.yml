name: Forensic EKPO Sequences 1-12 audit

on:
  push:
    branches: [agent/authoritative-canon-sync]
    paths: [.github/workflows/forensic-audit-1-12.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoritative-canon-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check reportlab pypdf pymupdf
      - name: Apply forensic screenplay corrections
        shell: python
        run: |
          from pathlib import Path
          p=Path('01_SCREENPLAY.fountain'); s=p.read_text(encoding='utf-8')
          def exact(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 source match, found {n}')
              s=s.replace(old,new)
          exact('''ENO\nConfidence is what people use when skill\nis not available.''','''ENO\nCook first.\n\nA beat.\n\nENO\nThen warn me.''','S5 Eno aphorism')
          exact('''Bode starts up the path faster than he walked down.\n\nStill short of a run.\n\nAfter several steps --\n\nBODE\nDon't look back.\n\nNo one does.''','''Bode starts up the path faster than he walked down.\n\nStill short of a run.\n\nThe brothers follow.\n\nNone of them looks back.''','S7 Bode knowledge leak')
          exact('''KAI\nIt changed when I looked at it.''','''KAI\nIt kept getting clearer.''','S8 attention exposition')
          exact('''Kai searches for an answer that does not improve him.\n\nKAI\nI wanted to know what it was.''','''Kai looks at the talisman.\n\nKAI\nI wanted to know what it was.''','S9 internal prose')
          exact('''Eno looks at Bode.\n\nThe look contains history the brothers do not have.''','''Eno looks at Bode.\n\nHe does not meet it.''','S9 unfilmable history')
          exact('''ENO\nYou do not carry what you do not understand through my house.''','''ENO\nYou don't know what it is and you carried it into my house?''','S9 Eno register')
          exact('''Malik opens it.\n\nHe knows the handwriting.\n\nNarrow block letters.''','''Malik opens it.\n\nNarrow block letters.''','S10 internal recognition')
          exact('''ADE\nNeither one gets to tell us what Dad meant.''','''ADE\nWe don't know what he meant.''','S11 stacked thesis')
          exact('''ENO\nYou have been in here long enough for breakfast to become lunch.''','''ENO\nBreakfast has been waiting for you since morning.''','S11 Eno cadence')
          exact('''ENO\nWhatever Solomon wanted, he is not here to do it.\n\nShe points through the open outer door toward the living house.\n\nENO\nYou are.''','''ENO\nSolomon is not here.\n\nShe points through the open outer door toward the living house.\n\nENO\nYou are.''','S11 thesis compression')
          exact('''ENO\nNow that democracy has finished, eat.\n\nAde takes a piece.\n\nADE\nI preferred tyranny. Less paperwork.''','''ENO\nMeeting finished?\n\nADE\nFor now.\n\nENO\nEat.\n\nAde takes a piece.''','S11 writer-visible banter')
          exact('''ADE\nI crossed an ocean to become unpaid labor.\n\nENO\nYou were unemployed in my kitchen. I corrected it.''','''ADE\nI crossed an ocean to become unpaid labor.\n\nENO\nThen work. Nobody invited you to stand there.''','S12 Eno banter')
          exact('''The passage tries to contain the Entity.\n\nIts height has nowhere to go.''','''The Entity occupies the passage.\n\nIts height has nowhere to go.''','S12 explanatory prose')
          exact("The girl's eyes start around his shoulder.","The girl's eyes move around his shoulder.",'S12 action prose')
          p.write_text(s,encoding='utf-8')
      - name: Full screenplay forensic regression gate
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('01_SCREENPLAY.fountain').read_text(encoding='utf-8'); lower=s.lower()
          required=['Give me one side.','Metal floods the back of his tongue.','It kept getting clearer.','DISTANCE UNCERTAIN.','RE-MEASURE.','Nobody goes anywhere alone.','Nobody decides alone.','The wall doubles.','The Entity does not.','One turn short.']
          required += [f'# SEQUENCE {i} -' for i in range(1,13)]
          for x in required:
              if x not in s: raise SystemExit('required screenplay material missing: '+x)
          forbidden=['mercy upon what remains unfinished','Your father had many beliefs before he had responsibilities','Someone your father loved badly','silence to stop being the only','Sound travels badly here. Water bends it','Distance changes quickly under these trees',"Don't look back.",'It changed when I looked at it.','The look contains history the brothers do not have.','You do not carry what you do not understand through my house.','He knows the handwriting.','Neither one gets to tell us what Dad meant.','breakfast to become lunch','Now that democracy has finished','You were unemployed in my kitchen. I corrected it.','The passage tries to contain the Entity.','doppelganger','Emeka','Chosen One','spider god','shrine is a prison','entity is generated by imbalance']
          for x in forbidden:
              if x.lower() in lower: raise SystemExit('forbidden/stale screenplay material remains: '+x)
          headings=re.findall(r'^# SEQUENCE (\d+) - ',s,re.M)
          if headings != [str(i) for i in range(1,13)]: raise SystemExit('bad Sequence ordering: '+repr(headings))
          if re.search(r'END OF SEQUENCE\s+[IVXLCDM]+\b',s): raise SystemExit('Roman numeral sequence marker survived')
          for token in ['<<<<<<<','=======','>>>>>>>']:
              if token in s: raise SystemExit('merge-conflict marker: '+token)
          print('Forensic screenplay regression PASS')
          print('Words:',len(re.findall(r"\b[\w’'-]+\b",s)))
      - name: Render exact current screenplay PDF
        run: python tools/render_screenplay.py 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf
      - name: Audit every rendered PDF page
        shell: python
        run: |
          from pathlib import Path
          from pypdf import PdfReader
          import pymupdf
          pdf=Path('output/pdf/EKPO_Screenplay.pdf')
          if not pdf.exists() or pdf.stat().st_size<50000: raise SystemExit('PDF missing or implausibly small')
          pages=len(PdfReader(str(pdf)).pages)
          if not 54<=pages<=62: raise SystemExit(f'Unexpected physical page count: {pages}')
          doc=pymupdf.open(pdf)
          blank=[]; edges=[]; tiny=[]; texts=[]; fonts=set()
          for i,page in enumerate(doc):
              text=page.get_text('text'); texts.append(text)
              if i>0 and len(text.strip())<80: blank.append(i+1)
              r=page.rect
              for b in page.get_text('blocks'):
                  x0,y0,x1,y1=b[:4]
                  if x0<8 or y0<8 or x1>r.width-8 or y1>r.height-8: edges.append((i+1,x0,y0,x1,y1))
              spans=[]
              for block in page.get_text('dict').get('blocks',[]):
                  for line in block.get('lines',[]): spans.extend(line.get('spans',[]))
              if spans and min(float(sp.get('size',99)) for sp in spans)<7: tiny.append(i+1)
              for f in page.get_fonts(full=True): fonts.add(f[3])
          if blank: raise SystemExit('blank/sparse screenplay pages: '+repr(blank))
          if edges: raise SystemExit('text edge/clipping risk: '+repr(edges[:20]))
          if tiny: raise SystemExit('unexpected tiny text: '+repr(tiny))
          alltext='\n'.join(texts)
          rendered_required=['A kettle begins to whistle.','Give me one side.','Metal floods the back of his tongue.','It kept getting clearer.','DISTANCE UNCERTAIN.','Nobody goes anywhere alone.','The wall doubles.','One turn short.']
          for x in rendered_required:
              if x not in alltext: raise SystemExit('Rendered PDF missing screenplay text: '+x)
          if not any('Courier' in f for f in fonts): raise SystemExit('Courier font missing: '+repr(fonts))
          print('PDF forensic page audit PASS')
          print('Physical pages:',pages)
          print('PDF bytes:',pdf.stat().st_size)
          print('Fonts:',sorted(fonts))
      - name: Commit authoritative screenplay and PDF
        shell: pwsh
        run: |
          git config user.name "EKPO Repository Agent"
          git config user.email "actions@users.noreply.github.com"
          if (Test-Path '.github/workflows/promote-opening-elevation.yml') { git rm .github/workflows/promote-opening-elevation.yml }
          git rm .github/workflows/forensic-audit-1-12.yml
          git add 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf
          git diff --cached --check
          git commit -m "Forensic polish and rerender EKPO through Sequence 12"
          git push origin HEAD:agent/authoritative-canon-sync
