name: Synchronize EKPO post-audit state

on:
  push:
    branches:
      - agent/authoritative-canon-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoritative-canon-sync
          fetch-depth: 0

      - name: Synchronize active memory documents
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise AssertionError(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          # 00_CANON.md
          replace_exact('00_CANON.md',
              'Version: 5.0 — Post-River Screenplay Integration',
              'Version: 5.1 — Award-Level Lock Through Sequence X')
          replace_exact('00_CANON.md',
              'Current producer PDF: 45 screenplay pages plus title page.',
              'Current producer PDF: 41 screenplay pages plus title page (42 physical pages total).')
          replace_exact('00_CANON.md',
              'Sequences VIII-X were rewritten on 2026-08-13 from the canon-clean Sequence VII river endpoint. The rewrite supersedes the earlier `THE HOUSE LISTENS`, `THE BROKEN KNOT`, and `THE CLOSED ROOM` versions.',
              'Sequences VIII-X were rewritten, award-audited, and accepted on 2026-08-13 from the canon-clean Sequence VII river endpoint. The accepted rewrite supersedes the earlier `THE HOUSE LISTENS`, `THE BROKEN KNOT`, and `THE CLOSED ROOM` versions.')
          replace_exact('00_CANON.md',
              'In Sequence VIII he observes that the partially perceptible form becomes clearer/closer the longer he looks at it, giving him his first experiential evidence of reciprocal attention.',
              'In Sequence VIII he observes that the partially perceptible form changes while he looks at it and states only: `It changed when I looked at it.` The audience receives stronger experiential evidence of reciprocal attention than Kai can yet explain.')

          # CURRENT_CONTINUITY.md
          replace_exact('docs/CURRENT_CONTINUITY.md',
              'Producer PDF: 45 screenplay pages plus title page',
              'Producer PDF: 41 screenplay pages plus title page (42 physical pages total)')
          replace_exact('docs/CURRENT_CONTINUITY.md',
              '- a partially perceptible tall, articulated presence became clearer/closer as Kai looked at it;',
              '- a partially perceptible tall, articulated presence changed in coherence while Kai looked at it;')
          replace_exact('docs/CURRENT_CONTINUITY.md',
              '- the presence withdrew without being defeated or explained;',
              '- the perceptible event ended without the presence crossing out of sight, being defeated, or being explained;')
          replace_exact('docs/CURRENT_CONTINUITY.md',
              '- challenges both Malik and Kai when either tries to decide for everyone;',
              '- remains inside the confrontation without turning fear into a theory or claiming authority;')
          replace_exact('docs/CURRENT_CONTINUITY.md',
              '- recognizes that prolonged observation made the house presence clearer/closer;',
              '- recognizes that the house presence changed while he was looking and later finds matching perceptual language in his aunt’s notes;')
          replace_exact('docs/CURRENT_CONTINUITY.md',
              '- admits that something happened on the land when he was young, his sister died, and Solomon changed afterward;',
              '- admits his sister died, Solomon came home from the land without her, and Solomon changed before beginning repeated returns to the land and hidden room;')
          replace_exact('docs/CURRENT_CONTINUITY.md',
              '- keeps children and uninformed relatives at the front of the compound;',
              '- keeps the unknown talisman stationary and the three brothers together overnight;')

          # CHARACTER_CANON.md
          replace_exact('docs/CHARACTER_CANON.md',
              'Kai watches the partially perceptible form become more coherent while the passage distance destabilizes. He later states that it became clearer the longer he looked and infers that it knew he was looking.\n\nThis is experiential evidence, not complete metaphysical understanding.',
              'Kai watches the partially perceptible form change in coherence while the passage distance destabilizes. After Malik breaks his sightline, Kai states only: `It changed when I looked at it.`\n\nThis is experiential evidence, not complete metaphysical understanding. The screenplay deliberately withholds the fuller rule from his dialogue.')
          replace_exact('docs/CHARACTER_CANON.md',
              'Ade initiates the first direct family acknowledgement of the river event. During the house disturbance, he tracks both brothers and recognizes the attention/proximity pattern in Kai’s description before Malik does.',
              'Ade initiates the first direct family acknowledgement of the river event. During the house disturbance, he tracks both brothers, stops joking when fear becomes undeniable, and reinforces Malik’s attempt to return Kai’s attention to a human face rather than explaining the phenomenon.')
          replace_exact('docs/CHARACTER_CANON.md',
              'Ade refuses unilateral authority from either Malik or Kai. He keeps the question collective.',
              'Ade remains inside the confrontation, asks why Kai kept the talisman, and does not seize authority or turn fear into metaphysical explanation. Eno makes the immediate household decision.')
          replace_exact('docs/CHARACTER_CANON.md',
              'She asserts that a room inside her house cannot remain protected from the people being endangered by the secrecy around it.',
              'She prevents anyone from moving the talisman, orders the brothers to remain together, and tells Bode to open Solomon’s room before breakfast.')

          # 03_SESSION.md
          replace_exact('03_SESSION.md',
              'Status: SCREENPLAY + CANON SYNCHRONIZED THROUGH SEQUENCE X',
              'Status: SCREENPLAY + CANON SYNCHRONIZED / AWARD-LEVEL PASS THROUGH SEQUENCE X')
          replace_exact('03_SESSION.md',
              'Current output PDF renders to 46 physical pages: one title page plus 45 screenplay pages.',
              'Current output PDF renders to 42 physical pages: one title page plus 41 screenplay pages.')
          replace_exact('03_SESSION.md',
              'The brothers remain together. River-style ecological sound withdrawal enters the house. Distance in the passage becomes perceptually unreliable. A tall articulated presence resolves only partially and becomes more legible/closer while Kai looks at it. Malik physically stabilizes Kai and breaks his visual attention. The event withdraws without defeat.\n\nKai’s experiential conclusion: it knew he was looking.',
              'The brothers remain together. River-style ecological sound withdrawal enters the house. Distance in the passage becomes perceptually unreliable. A tall articulated presence resolves only partially and changes in coherence while Kai looks at it. Malik physically stabilizes Kai and breaks his visual attention. Nothing visibly leaves or is defeated.\n\nKai’s only stated conclusion: `It changed when I looked at it.`')
          replace_exact('03_SESSION.md',
              'Bode reveals human history: something happened on the land, his sister died, Solomon changed, and Solomon repeatedly returned to Calabar for hidden work.',
              'Bode reveals only human fragments he can defend: his sister died, Solomon came home from the land without her, Solomon changed, and later kept returning to the land and hidden room.')
          replace_exact('03_SESSION.md',
              'Knows his prolonged attention correlated with increased Entity legibility/proximity and that his aunt documented highly similar perceptual phenomena.',
              'Knows the house presence changed while he looked at it and that his aunt documented highly similar perceptual phenomena, including attention-linked distance change.')

          # README.md
          replace_exact('README.md',
              'Current PDF: **46 physical pages total — 1 title page + 45 screenplay pages.**',
              'Current PDF: **42 physical pages total — 1 title page + 41 screenplay pages.**')
          replace_exact('README.md',
              'Sequences VIII-X were rewritten under the final two-function stewardship / breach-seeking Entity canon.',
              'Sequences VIII-X were rewritten under the final two-function stewardship / breach-seeking Entity canon and passed the project’s award-level screenplay audit.')

          # PROJECT_MANIFEST.yaml
          replace_exact('PROJECT_MANIFEST.yaml',
              '  development_phase: post-river-screenplay-integration',
              '  development_phase: sequence-x-award-lock-sequence-xi-development')
          replace_exact('PROJECT_MANIFEST.yaml', '    screenplay_pages: 45', '    screenplay_pages: 41', expected=2)
          replace_exact('PROJECT_MANIFEST.yaml', '    physical_pdf_pages: 46', '    physical_pdf_pages: 42')
          replace_exact('PROJECT_MANIFEST.yaml', '    physical_pages: 46', '    physical_pages: 42')
          replace_exact('PROJECT_MANIFEST.yaml',
              '  characters:\n    - docs/CHARACTER_CANON.md',
              '  characters:\n    - docs/CHARACTER_CANON.md\n    - docs/CHARACTER_VOICE_CONSTITUTION.md')

          # DECISION_LOG.md — new current decision supersedes the earlier failed gate/prose-not-locked state.
          p = Path('docs/DECISION_LOG.md')
          text = p.read_text(encoding='utf-8')
          anchor = 'Older decisions remain historical when superseded and must not silently return.\n\n---\n'
          assert text.count(anchor) == 1
          entry = '''Older decisions remain historical when superseded and must not silently return.\n\n---\n\nDATE:\n2026-08-13\n\nTITLE:\nAward-Level Screenplay Gate — Passed Through Sequence X\n\nDECISION:\nThe integrated screenplay through Sequence X passes EKPO's current award-level execution gate. The accepted Sequences VIII-X prose is now the canonical screenplay execution, not merely approved architecture.\n\nThe promotion preserved the complete Sequences I-VII byte prefix, replaced only VIII-X, regenerated `output/pdf/EKPO_Screenplay.pdf` through the repository Windows/Courier renderer, and passed regression plus page-by-page PDF review.\n\nThe producer reading copy is 42 physical pages total: one title page plus 41 screenplay pages.\n\n`docs/CHARACTER_VOICE_CONSTITUTION.md` is an active screenplay control document. Voice distinction must continue to arise from character psychology, knowledge, objective, and pressure rather than decorative verbal style.\n\nSequence XI development is unlocked. Passing this gate does not authorize merging PR #2 to `main`; merge remains an explicit creator action.\n\nSTATUS:\nLOCKED SCREENPLAY THROUGH SEQUENCE X / QUALITY GATE PASSED\n\nSUPERSEDES:\n- the earlier `Award-Level Screenplay Gate` FAIL status;\n- the `SCREENPLAY PROSE NOT LOCKED` status attached to the pre-pass VIII-X rewrite;\n- the prior 46-physical-page producer baseline.\n\n---\n'''
          p.write_text(text.replace(anchor, entry), encoding='utf-8', newline='\n')

          replace_exact('docs/DECISION_LOG.md',
              'These outcomes are locked. The current exact wording and beat density remain under award-level rewrite.',
              'These outcomes are locked. The exact wording and beat density were subsequently accepted by the `Award-Level Screenplay Gate — Passed Through Sequence X` decision above.')
          replace_exact('docs/DECISION_LOG.md',
              'STATUS:\nLOCKED ARCHITECTURE / SCREENPLAY PROSE NOT LOCKED',
              'STATUS:\nLOCKED ARCHITECTURE / HISTORICAL PRE-PASS PROSE STATUS')

          # Stale-state gate across active authority/memory files.
          active = [
              '00_CANON.md', 'README.md', 'PROJECT_MANIFEST.yaml', '03_SESSION.md',
              'docs/CURRENT_CONTINUITY.md', 'docs/CHARACTER_CANON.md',
              'docs/NEXT_MOVEMENT.md', 'development/audits/EKPO_AWARD_LEVEL_SCREENPLAY_AUDIT.md'
          ]
          stale = [
              '46 physical pages',
              '45 screenplay pages',
              'it knew he was looking',
              'became clearer/closer as Kai looked at it',
              'recognizes that prolonged observation made the house presence clearer/closer',
              'AUDIT FAILED',
              'FAIL UNTIL INTEGRATED PDF PASSES',
          ]
          for path in active:
              t = Path(path).read_text(encoding='utf-8').lower()
              for phrase in stale:
                  if phrase.lower() in t:
                      raise AssertionError(f'Stale state remains in {path}: {phrase}')

          print('Active repository memory synchronized to the accepted 42-page screenplay.')

      - name: Commit synchronized state and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-ekpo-post-audit-state.yml
          git add 00_CANON.md 03_SESSION.md README.md PROJECT_MANIFEST.yaml \
            docs/CURRENT_CONTINUITY.md docs/CHARACTER_CANON.md docs/DECISION_LOG.md
          git diff --cached --check
          git commit -m "Synchronize EKPO state after award-level Sequence X pass"
          git push origin HEAD:agent/authoritative-canon-sync
