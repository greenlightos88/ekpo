name: Export EKPO audit copy

on:
  push:
    branches:
      - agent/authoritative-canon-sync

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoritative-canon-sync
      - name: Upload committed screenplay
        uses: actions/upload-artifact@v4
        with:
          name: ekpo-committed-screenplay
          path: output/pdf/EKPO_Screenplay.pdf
          if-no-files-found: error
          retention-days: 1
