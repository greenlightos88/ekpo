name: Promote Sequences 11-12

on:
  push:
    branches:
      - agent/authoritative-canon-sync
    paths:
      - .github/workflows/promote-sequences-11-12.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python -m pip install reportlab pypdf
      - name: Verify baseline and promote candidate
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          base_path = Path('01_SCREENPLAY.fountain')
          base = base_path.read_bytes()
          expected = 'b626744dfe1659a99712e1ad31b83f97a5105bdcfcc2fb89cddb45d640ee239c'
          actual = hashlib.sha256(base).hexdigest()
          assert actual == expected, f'Authoritative Sequence 1-10 baseline changed: {actual}'
          text = base.decode('utf-8')
          assert '# SEQUENCE 11' not in text
          candidate = Path('development/rewrites/SEQUENCES_11_12_AWARD_PASS.fountain').read_text(encoding='utf-8').strip()
          assert candidate.startswith('# SEQUENCE 11 - WHAT HE LEFT')
          assert '# SEQUENCE 12 - WHEN IT STAYS' in candidate
          integrated = text.rstrip() + '\n\n' + candidate + '\n'
          assert integrated.startswith(text.rstrip())
          base_path.write_text(integrated, encoding='utf-8', newline='\n')
          print('PROMOTED_SHA256=' + hashlib.sha256(base_path.read_bytes()).hexdigest())
      - name: Render producer PDF
        run: python tools/render_screenplay.py 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf
      - name: Validate promoted PDF
        shell: python
        run: |
          from pypdf import PdfReader
          from pathlib import Path
          pdf = PdfReader('output/pdf/EKPO_Screenplay.pdf')
          assert len(pdf.pages) == 58, f'Expected 58 physical pages, got {len(pdf.pages)}'
          assert not pdf.is_encrypted
          text = Path('01_SCREENPLAY.fountain').read_text(encoding='utf-8')
          assert text.count('# SEQUENCE 11 - WHAT HE LEFT') == 1
          assert text.count('# SEQUENCE 12 - WHEN IT STAYS') == 1
          for banned in ['# SEQUENCE XI', '# SEQUENCE XII', 'Entity feeds on attention']:
              assert banned.lower() not in text.lower(), f'Banned text present: {banned}'
          print('PHYSICAL_PAGES=58')
          print('SCREENPLAY_PAGES=57')
      - name: Commit authoritative screenplay and clean temporary workflows
        shell: pwsh
        run: |
          git config user.name 'EKPO Repository Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf
          git rm -f .github/workflows/audit-sequences-11-12.yml
          git rm -f .github/workflows/promote-sequences-11-12.yml
          git commit -m 'Promote award-level Sequences 11-12'
          git push origin HEAD:agent/authoritative-canon-sync
