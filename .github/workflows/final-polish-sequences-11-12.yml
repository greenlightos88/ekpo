name: Final Polish Sequences 11-12

on:
  push:
    branches:
      - agent/authoritative-canon-sync
    paths:
      - .github/workflows/final-polish-sequences-11-12.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python -m pip install reportlab pypdf
      - name: Apply filmable-prose corrections
        shell: python
        run: |
          from pathlib import Path
          paths = [
              Path('01_SCREENPLAY.fountain'),
              Path('development/rewrites/SEQUENCES_11_12_AWARD_PASS.fountain'),
          ]
          replacements = [
              ("ENO\nWhatever Solomon wanted, he is not here to do it.\n\nShe points through the open outer door toward the living house.\n\nENO\nYou are.\n\nNot philosophy.\n\nA fact.\n",
               "ENO\nWhatever Solomon wanted, he is not here to do it.\n\nShe points through the open outer door toward the living house.\n\nENO\nYou are.\n"),
              ("The answer disarms Kai more than another argument would.\n",
               "Kai has no reply.\n"),
              ("Kai does not like it.\n\nBut he cannot call it control disguised as certainty.\n",
               "Kai looks at the missed date.\n\nThen at Malik.\n"),
              ("Malik is moving before he understands why.\n",
               "Malik is already moving.\n"),
              ("Ade accepts that.\n",
               "Ade goes back to the towel.\n"),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected prose in {path}: {old[:60]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
      - name: Render producer PDF
        run: python tools/render_screenplay.py 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf
      - name: Validate final render
        shell: python
        run: |
          from pypdf import PdfReader
          from pathlib import Path
          pdf = PdfReader('output/pdf/EKPO_Screenplay.pdf')
          assert len(pdf.pages) == 58, len(pdf.pages)
          text = Path('01_SCREENPLAY.fountain').read_text(encoding='utf-8')
          for bad in ['Not philosophy.\n\nA fact.', 'control disguised as certainty', 'The answer disarms Kai', 'before he understands why']:
              assert bad not in text
          print('FINAL_PHYSICAL_PAGES=58')
      - name: Commit and remove workflow
        shell: pwsh
        run: |
          git config user.name 'EKPO Repository Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf development/rewrites/SEQUENCES_11_12_AWARD_PASS.fountain
          git rm -f .github/workflows/final-polish-sequences-11-12.yml
          git commit -m 'Polish award-level Sequences 11-12 prose'
          git push origin HEAD:agent/authoritative-canon-sync
