name: Brass object canon sync

on:
  push:
    branches:
      - agent/sequence-12-geography-sequence-13-marketplace
    paths:
      - .github/workflows/brass-object-canon-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sequence-12-geography-sequence-13-marketplace
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply brass object canon
        run: python tools/apply_brass_object_canon.py

      - name: Repository integrity check
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/BRASS_OBJECT_CONTINUITY.md
          grep -q "Retired sister-era brass carving" 00_CANON.md
          grep -q "Active replacement brass talisman" 00_CANON.md
          grep -q "same old regulatory component visible in the scratched photograph" docs/CURRENT_CONTINUITY.md
          grep -q "LOCKED / FOUNDATIONAL OBJECT + SOLOMON BACKSTORY CANON" docs/DECISION_LOG.md
          grep -q "Two related brass objects are distinct" PROJECT_MANIFEST.yaml
          git diff --check

      - name: Commit synchronized canon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EKPO Repository Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/brass-object-canon-sync.yml
          git rm tools/apply_brass_object_canon.py
          git add \
            EKPO_Canonical_Mythology_Refactor.md \
            00_CANON.md \
            docs/CURRENT_CONTINUITY.md \
            docs/CHARACTER_CANON.md \
            02_MASTER_BIBLE.md \
            docs/MOTIF_LEDGER.md \
            PROJECT_MANIFEST.yaml \
            docs/DECISION_LOG.md \
            docs/BRASS_OBJECT_CONTINUITY.md
          git diff --cached --check
          git commit -m "Lock sister-era brass carving and replacement talisman canon"
          git push origin HEAD:agent/sequence-12-geography-sequence-13-marketplace
