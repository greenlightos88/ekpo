          from pathlib import Path
          from pypdf import PdfReader
          text = Path('01_SCREENPLAY.fountain').read_text(encoding='utf-8')
          for n in range(1,13):
              assert f'# SEQUENCE {n} -' in text, n
          for roman in ['# SEQUENCE I -','# SEQUENCE II -','# SEQUENCE III -','# SEQUENCE IV -','# SEQUENCE V -','# SEQUENCE VI -','# SEQUENCE VII -','# SEQUENCE VIII -','# SEQUENCE IX -','# SEQUENCE X -']:
              assert roman not in text
          pdf = PdfReader('output/pdf/EKPO_Screenplay.pdf')
          assert len(pdf.pages) == 58, len(pdf.pages)
          assert 'Sequence 13' in Path('docs/NEXT_MOVEMENT.md').read_text(encoding='utf-8')
          assert 'End of Sequence 12' in Path('docs/CURRENT_CONTINUITY.md').read_text(encoding='utf-8')
          assert 'sequence_12' in Path('PROJECT_MANIFEST.yaml').read_text(encoding='utf-8')
          print('SYNC_OK pages=58')
      - name: Commit and remove sync workflow
        shell: pwsh
        run: |
          git config user.name 'EKPO Repository Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf 00_CANON.md 03_SESSION.md README.md PROJECT_MANIFEST.yaml docs/CURRENT_CONTINUITY.md docs/NEXT_MOVEMENT.md docs/DECISION_LOG.md docs/CHARACTER_CANON.md docs/MOTIF_LEDGER.md development/audits/EKPO_AWARD_LEVEL_SCREENPLAY_AUDIT.md
          git rm -f .github/workflows/sync-sequence-12-state.yml
          git commit -m 'Synchronize EKPO through Sequence 12'
          git push origin HEAD:agent/authoritative-canon-sync
