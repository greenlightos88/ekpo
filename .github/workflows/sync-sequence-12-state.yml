name: Synchronize Sequence 12 State

on:
  push:
    branches:
      - agent/authoritative-canon-sync
    paths:
      - .github/workflows/sync-sequence-12-state.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python -m pip install reportlab pypdf
      - name: Synchronize screenplay numbering and repository memory
        shell: python
        run: |
          from pathlib import Path

          # 1) Normalize sequence labels in the authoritative screenplay.
          screenplay_path = Path('01_SCREENPLAY.fountain')
          s = screenplay_path.read_text(encoding='utf-8')
          roman = [('X','10'),('IX','9'),('VIII','8'),('VII','7'),('VI','6'),('V','5'),('IV','4'),('III','3'),('II','2'),('I','1')]
          for old, new in roman:
              s = s.replace(f'# SEQUENCE {old} -', f'# SEQUENCE {new} -')
          screenplay_path.write_text(s, encoding='utf-8', newline='\n')

          # Keep accepted rewrite/control candidate numbering consistent.
          for rel in ['development/rewrites/SEQUENCES_11_12_AWARD_PASS.fountain']:
              p = Path(rel)
              if p.exists():
                  t = p.read_text(encoding='utf-8')
                  for old, new in roman:
                      t = t.replace(f'# SEQUENCE {old} -', f'# SEQUENCE {new} -')
                  p.write_text(t, encoding='utf-8', newline='\n')

          # 2) Current continuity becomes authoritative through Sequence 12.
          Path('docs/CURRENT_CONTINUITY.md').write_text('''# EKPO CURRENT CONTINUITY

