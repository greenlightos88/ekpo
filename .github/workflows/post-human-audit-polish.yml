name: Post-human-audit polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sequence-12-geography-sequence-13-marketplace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check reportlab pypdf pymupdf
      - name: Apply final human-audit polish
        run: python tools/post_human_audit_polish.py
      - name: Full source regression
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('01_SCREENPLAY.fountain').read_text(encoding='utf-8')
          lower=s.lower()
          required=['# SEQUENCE 13 - THE MARKET','Ade and Kai follow his gaze.','FIELD OF RED CORD','After she died, Solomon stopped letting anybody down here.','They cross the open courtyard toward the gate','That\'s your solution?','We left the house.']
          for x in required:
              if x not in s: raise SystemExit('missing required screenplay material: '+x)
          forbidden=['The three brothers follow his gaze.','\nENO\nCar.\n','One turn short.','loose brass fastener','Medical advice has changed.','One lower interval remains unfinished','Return what was dislodged.']
          for x in forbidden:
              if x.lower() in lower: raise SystemExit('legacy screenplay material remains: '+x)
          heads=re.findall(r'^# SEQUENCE (\d+) - ',s,re.M)
          if heads != [str(i) for i in range(1,14)]: raise SystemExit('bad sequence order: '+repr(heads))
          for token in ['<<<<<<<','=======','>>>>>>>']:
              if token in s: raise SystemExit('merge-conflict marker '+token)
          if re.search(r'END OF SEQUENCE\s+[IVXLCDM]+\b',s): raise SystemExit('Roman sequence marker')
          print('source regression PASS')
      - name: Render exact candidate PDF
        run: python tools/render_screenplay.py 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf
      - name: Audit all rendered pages
        shell: python
        run: |
          from pathlib import Path
          from pypdf import PdfReader
          import pymupdf
          pdf=Path('output/pdf/EKPO_Screenplay.pdf')
          if not pdf.exists() or pdf.stat().st_size < 50000: raise SystemExit('PDF missing/small')
          pages=len(PdfReader(str(pdf)).pages)
          doc=pymupdf.open(pdf)
          blank=[]; edges=[]; tiny=[]; texts=[]; fonts=set()
          for i,page in enumerate(doc):
              t=page.get_text('text'); texts.append(t)
              if i>0 and len(t.strip())<80: blank.append(i+1)
              r=page.rect
              for b in page.get_text('blocks'):
                  x0,y0,x1,y1=b[:4]
                  if x0<8 or y0<8 or x1>r.width-8 or y1>r.height-8: edges.append(i+1)
              spans=[]
              for block in page.get_text('dict').get('blocks',[]):
                  for line in block.get('lines',[]): spans.extend(line.get('spans',[]))
              if spans and min(float(sp.get('size',99)) for sp in spans)<7: tiny.append(i+1)
              for f in page.get_fonts(full=True): fonts.add(f[3])
          if blank: raise SystemExit('blank/sparse pages '+repr(blank))
          if edges: raise SystemExit('edge/clipping risk '+repr(sorted(set(edges))))
          if tiny: raise SystemExit('tiny text '+repr(tiny))
          if not any('Courier' in f for f in fonts): raise SystemExit('Courier missing')
          alltext='\n'.join(texts)
          for x in ['Ade and Kai follow his gaze.','We left the house.']:
              if x not in alltext: raise SystemExit('render missing '+x)
          print('PDF PASS physical_pages=',pages,'bytes=',pdf.stat().st_size)
      - name: Canon legacy scan
        shell: python
        run: |
          from pathlib import Path
          active=['00_CANON.md','README.md','PROJECT_MANIFEST.yaml','docs/CURRENT_CONTINUITY.md','docs/SEQUENCE_12_LOCK.md','docs/NEXT_MOVEMENT.md','docs/MOTIF_LEDGER.md','docs/ENTITY_HORROR_PHYSIOLOGY.md','docs/HOUSE_GEOGRAPHY.md','docs/REGULATOR_CORD_ARRAY.md']
          banned=['inner-door fastener changed state','one turn short','Eno has ordered the car','its fastener changes state for unknown reasons']
          for path in active:
              text=Path(path).read_text(encoding='utf-8').lower()
              for x in banned:
                  if x.lower() in text: raise SystemExit(f'{path}: stale material {x}')
          print('active canon legacy scan PASS')
      - name: Commit polished candidate
        shell: pwsh
        run: |
          git config user.name "EKPO Repository Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/post-human-audit-polish.yml
          git rm tools/post_human_audit_polish.py
          git add 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf docs/MOTIF_LEDGER.md docs/ENTITY_HORROR_PHYSIOLOGY.md
          git diff --cached --check
          git commit -m "Polish human-audit revision and rerender through Sequence 13"
          git push origin HEAD:agent/sequence-12-geography-sequence-13-marketplace
