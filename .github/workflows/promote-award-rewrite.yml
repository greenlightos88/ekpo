name: Promote EKPO award rewrite

on:
  push:
    branches:
      - agent/authoritative-canon-sync

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/authoritative-canon-sync
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check reportlab pypdf

      - name: Promote accepted Sequences VIII-X without touching I-VII
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          source_path = Path('01_SCREENPLAY.fountain')
          candidate_path = Path('development/rewrites/SEQUENCES_VIII_X_AWARD_PASS.fountain')
          marker = b'# SEQUENCE VIII - THE DISTANCE BETWEEN'

          original = source_path.read_bytes()
          candidate = candidate_path.read_bytes()
          source_cut = original.index(marker)
          candidate_cut = candidate.index(marker)

          prefix_before = original[:source_cut]
          merged = prefix_before + candidate[candidate_cut:]
          source_path.write_bytes(merged)

          promoted = source_path.read_bytes()
          promoted_cut = promoted.index(marker)
          assert promoted[:promoted_cut] == prefix_before, 'Sequences I-VII changed during promotion.'

          print('I-VII SHA256:', hashlib.sha256(prefix_before).hexdigest())
          print('Promoted source SHA256:', hashlib.sha256(promoted).hexdigest())

      - name: Run screenplay regression gate
        shell: python
        run: |
          from pathlib import Path
          text = Path('01_SCREENPLAY.fountain').read_text(encoding='utf-8')

          required = [
              '# SEQUENCE VIII - THE DISTANCE BETWEEN',
              '# SEQUENCE IX - WHAT HE OPENED',
              '# SEQUENCE X - THE TWO RECORDS',
              'It changed when I looked at it.',
              'Three of you came into this kitchen barefoot and shaking.',
              'DISTANCE UNCERTAIN.',
              'RE-MEASURE.',
          ]
          for phrase in required:
              assert phrase in text, f'Missing required promoted material: {phrase}'

          forbidden = [
              'I think it knew I was looking.',
              'They were doing this together.',
              'He was trying to write what she wrote.',
              'I know that place was kept closed.',
              'doppelganger',
              'Emeka',
              'Chosen One',
              'containment prison',
          ]
          lower = text.lower()
          for phrase in forbidden:
              assert phrase.lower() not in lower, f'Forbidden/superseded material survived: {phrase}'

          assert text.count('# SEQUENCE VIII - THE DISTANCE BETWEEN') == 1
          assert text.count('# SEQUENCE IX - WHAT HE OPENED') == 1
          assert text.count('# SEQUENCE X - THE TWO RECORDS') == 1
          print('Screenplay regression gate passed.')

      - name: Render producer PDF with repository renderer
        run: python tools/render_screenplay.py 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf

      - name: Verify PDF
        shell: python
        run: |
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path('output/pdf/EKPO_Screenplay.pdf')
          assert pdf.exists() and pdf.stat().st_size > 50000, 'Rendered PDF missing or implausibly small.'
          reader = PdfReader(str(pdf))
          pages = len(reader.pages)
          assert 38 <= pages <= 46, f'Unexpected physical page count: {pages}'
          print('Physical PDF pages:', pages)
          print('PDF bytes:', pdf.stat().st_size)

      - name: Remove one-shot workflow and commit promoted reading copy
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/promote-award-rewrite.yml
          git add 01_SCREENPLAY.fountain output/pdf/EKPO_Screenplay.pdf
          git diff --cached --check
          git commit -m "Promote award-level Sequences VIII-X and regenerate screenplay PDF"
          git push origin HEAD:agent/authoritative-canon-sync
