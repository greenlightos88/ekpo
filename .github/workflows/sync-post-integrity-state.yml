name: Sync post-integrity state

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sequence-12-geography-sequence-13-marketplace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize control state
        run: python tools/sync_post_integrity_state.py
      - name: Validate control state
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            '00_CANON.md':['internal high-threshold human/spatial/render/continuity gate has passed','two-layer exposure model remains an audit candidate, not canon'],
            'docs/CURRENT_CONTINUITY.md':['passed the internal high-threshold human/spatial/render/continuity gate'],
            'docs/NEXT_MOVEMENT.md':['INTERNAL HIGH-THRESHOLD PASS','all internal tests below passed on the 64-page candidate'],
            'PROJECT_MANIFEST.yaml':['internal-integrity-pass-creator-review-required','EKPO_POST_WITNESS_REMOVAL_FULL_INTEGRITY_AUDIT.md'],
            'README.md':['has passed the internal high-threshold human/spatial/render/continuity gate','EKPO_POST_WITNESS_REMOVAL_FULL_INTEGRITY_AUDIT.md']
          }
          for p,terms in checks.items():
            t=Path(p).read_text(encoding='utf-8')
            for term in terms:
              if term not in t: raise SystemExit(f'{p}: missing {term}')
          print('CONTROL STATE PASS')
          PY
      - name: Commit synchronized state
        run: |
          git config user.name "EKPO Repository Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/sync-post-integrity-state.yml tools/sync_post_integrity_state.py
          git add 00_CANON.md README.md PROJECT_MANIFEST.yaml docs/CURRENT_CONTINUITY.md docs/NEXT_MOVEMENT.md
          git diff --cached --check
          git commit -m "Synchronize post-integrity control state"
          git push origin HEAD:agent/sequence-12-geography-sequence-13-marketplace
