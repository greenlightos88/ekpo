version: 1.0
project:
  id: ekpo
  title: EKPO
  repository: greenlightos88/ekpo
  default_branch: main
  integration_branch: integrate/greenlit-kernel-v1
  status: active-development
  format: feature-screenplay
  development_phase: prestige-feature-rewrite

knowledge_engine:
  repository: greenlightos88/knowledge-engine
  required_branch: build/creative-knowledge-engine-v1
  compatibility: kernel-v0.2

north_star:
  statement: Psychological supernatural family drama about inheritance.
  subject: family
  engine: inheritance
  doorway: grief
  supernatural_function: language

production_intent:
  standard:
    - director-facing
    - actor-facing
    - producer-readable
    - prestige without vagueness or overwritten prose
  location_profile:
    - Vancouver, British Columbia
    - Calabar and Oku family land, Cross River State, Nigeria
  cultural_review_required:
    - Efik language and cadence
    - Calabar family behavior and material culture
    - shrine and ritual terminology

source_hierarchy:
  - rank: 1
    authority: current-user-instruction
    rule: Latest explicit user correction may supersede a prior lock only when the reversal is recorded.
  - rank: 2
    authority: locked-decisions
    paths:
      - docs/DECISION_LOG.md
  - rank: 3
    authority: creative-constitution
    paths:
      - docs/EKPO_CONSTITUTION.md
  - rank: 4
    authority: canonical-screenplay
    paths:
      - 01_SCREENPLAY.fountain
  - rank: 5
    authority: current-continuity-and-canon
    paths:
      - 00_CANON.md
      - docs/CURRENT_CONTINUITY.md
      - 03_SESSION.md
  - rank: 6
    authority: project-development-records
    paths:
      - 02_MASTER_BIBLE.md
      - 04_ACT_I_DEVELOPMENT.md
      - 05_MASTER_CHARACTER_BREAKDOWN.md
      - 06_ACT_II_DEVELOPMENT.md
      - 07_ACT_II_NIGHT_KITCHEN_DEVELOPMENT.md
      - 08_ACT_II_MORNING_ROOM_DEVELOPMENT.md
      - docs/MOTIF_LEDGER.md
      - docs/NEXT_MOVEMENT.md
  - rank: 7
    authority: inference
    rule: Conservative only; never invent deferred cultural or supernatural terminology.

canonical_sources:
  screenplay:
    editable: 01_SCREENPLAY.fountain
    producer_pdf: output/pdf/EKPO_Screenplay.pdf
  canon:
    - 00_CANON.md
    - docs/EKPO_CONSTITUTION.md
    - docs/CURRENT_CONTINUITY.md
  decisions:
    - docs/DECISION_LOG.md
  characters:
    - 05_MASTER_CHARACTER_BREAKDOWN.md
  bible:
    - 02_MASTER_BIBLE.md
  motifs:
    - docs/MOTIF_LEDGER.md
  active_assignment:
    - docs/NEXT_MOVEMENT.md
  session_state:
    - 03_SESSION.md

locked_project_laws:
  - Solomon is never shown alive.
  - Kai deliberately breaks the shrine seal and removes the talisman; he is not chosen, possessed, or mind-controlled.
  - The shrine is a regulator or mediator of balance, not a generic monster prison.
  - The Entity is not canonically evil, demonic, or a spider god.
  - No impossible supernatural event occurs before the shrine breach.
  - Bode never withholds information merely to prolong plot.
  - Culture must be expressed through behavior and relationship, never decoration or exposition service.
  - Deferred Efik, shrine, ritual, regulator, and Entity terminology must not be invented before specialist review.

artifact_registry:
  screenplay:
    path: 01_SCREENPLAY.fountain
    writable: true
    synchronization_targets:
      - 00_CANON.md
      - docs/CURRENT_CONTINUITY.md
      - docs/DECISION_LOG.md
      - docs/NEXT_MOVEMENT.md
      - 03_SESSION.md
  master_bible:
    path: 02_MASTER_BIBLE.md
    writable: true
    synchronization_targets:
      - 00_CANON.md
      - docs/DECISION_LOG.md
  character_breakdown:
    path: 05_MASTER_CHARACTER_BREAKDOWN.md
    writable: true
    synchronization_targets:
      - 00_CANON.md
      - docs/DECISION_LOG.md
  producer_screenplay_pdf:
    path: output/pdf/EKPO_Screenplay.pdf
    writable: false
    generated_from: 01_SCREENPLAY.fountain

routing_overrides:
  covenant_cosmology:
    route: canon_or_mythology_refactor
    required_sources:
      - docs/EKPO_CONSTITUTION.md
      - 00_CANON.md
      - docs/DECISION_LOG.md
      - 01_SCREENPLAY.fountain
    required_gates:
      - canon-integrity
      - intent-alignment
      - continuity
      - cultural-restraint
      - human-writing
  scene_revision:
    route: scene_revision
    required_sources:
      - 01_SCREENPLAY.fountain
      - docs/EKPO_CONSTITUTION.md
      - 00_CANON.md
      - docs/CURRENT_CONTINUITY.md
    required_gates:
      - scene-function
      - character-causality
      - canon-integrity
      - human-writing

write_policy:
  default_mode: propose-diff
  direct_write: false
  approval_required: true
  branch_required: true
  decision_log_required_for:
    - canon change
    - lock reversal
    - character engine change
    - supernatural capability change
    - chronology change
    - cultural terminology change

completion_contract:
  - Requested artifact is complete and playable.
  - Locked decisions and source hierarchy are preserved.
  - Any conflict is surfaced before mutation.
  - Downstream synchronization targets are reported.
  - No deferred terminology is invented.
  - Producer-facing outputs remain derived from canonical editable sources.
