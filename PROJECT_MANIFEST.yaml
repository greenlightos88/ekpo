locked_project_laws:
  - "Solomon is never shown alive."
  - "Seen and Unseen are complementary; the shrine regulates rather than imprisons."
  - "The familiar Entity follows unauthorized inward pressure; the second presence remains unseen."
  - "Only anchored chamber lines recruit a consenting operator; no bloodline, chosen-one, ghost, possession or sentient-rope rules."
  - "Exactly two brass object identities exist; the later active fitting fractures into two halves."
  - "Kai deliberately removes the exposed half; its matching half stays seated until the final repair."
  - "Malik, Kai and Ade survive by distributing pressure through an open return."
  - "The final shrine binding must hold while remaining openable."
  - "Bode and Eno retain bounded family and household functions."
  - "Injuries persist; culturally specific naming and specialist authenticity review remain deferred."
