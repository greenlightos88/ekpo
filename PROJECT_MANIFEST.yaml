locked_project_laws:
  - "Solomon is never shown alive."
  - "Kai deliberately breaches the shrine/regulator; he is not chosen, possessed, or mind-controlled."
  - "Seen and Unseen are complementary conditions."
  - "Covenant = stewardship/equilibrium, not containment."
  - "Shrine = regulator/alignment point, never prison."
  - "Entity = independent ancient Unseen intelligence attracted to breaches."
  - "Attention creates proximity, but characters learn this behaviorally."
  - "Entity perceptibility is failed translation and may fracture human perception, bodily sequence, and local physical coherence."
  - "Perceptual stutter is not a digital glitch, teleportation effect, or generic time-control power."
  - "Physiological effects persist after Entity withdrawal."
  - "Solomon and his sister held complementary procedural/perceptual functions."
  - "Succession requires recognized capacity, transmitted knowledge, and voluntary acceptance."
  - "Solomon left access without appointment."
  - "Malik has procedural aptitude without appointment."
  - "Kai has perceptual aptitude without Chosen One status."
  - "Ade has no supernatural office; his social intelligence is protective infrastructure."
  - "Bode is not a co-custodian or maintenance proxy."
  - "Eno is household authority, not mythology expert."
  - "Inner maintained door remains closed; the superseded moving-fastener beat is removed."
  - "Only the inner diagnostic cord array has established pressure-indicating movement."
  - "Normal house geography must be coherent before supernatural distortion violates it."
  - "The masquerade is never the Entity and is not horror shorthand."
  - "Sequence numbers use Arabic numerals only."
  - "Deferred cultural/ritual terminology must not be invented before specialist review."

write_policy:
  default_mode: propose-diff
  approval_required: true
  branch_required: true

completion_contract:
  - "PR #3 remains draft until the human/spatial/cultural/render/continuity gate passes."
  - "Candidate output PDF and Fountain remain synchronized."
  - "Residual injuries and continuity consequences persist."
  - "No moving-fastener or car/hospital subplot may re-enter by drift."
  - "Character voice, geography, horror mechanics, cultural integrity, and family-protection stakes are audited before promotion."
  - "Sequence numbering uses standard numerical denominations only."}